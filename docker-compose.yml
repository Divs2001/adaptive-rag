# Works with Rancher Desktop (dockerd/moby mode): docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC (used by Spring AI)
    volumes:
      - qdrant_data:/qdrant/storage
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  qdrant_data:
  mongo_data:
