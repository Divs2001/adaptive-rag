spring:
  application:
    name: adaptive-rag
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documents
        initialize-schema: true
  # Spring Boot 4 moved connection settings from spring.data.mongodb.* to spring.mongodb.*
  mongodb:
    uri: mongodb://localhost:27017/adaptive_rag
  data:
    mongodb:
      # Create indexes declared with @Indexed (e.g. on sessionId) at startup
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

rag:
  chunking:
    chunk-size: 500
    overlap: 50
  retrieval:
    top-k: 4
    similarity-threshold: 0.5
  chat-history:
    max-messages: 6
  web-search:
    max-results: 5
    tavily:
      base-url: https://api.tavily.com
      # Never commit the key: it's read from the TAVILY_API_KEY environment variable
      api-key: ${TAVILY_API_KEY:}
