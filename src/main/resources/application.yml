spring:
  application:
    name: adaptive-rag
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documents
        initialize-schema: true
  # Spring Boot 4 moved connection settings from spring.data.mongodb.* to spring.mongodb.*
  mongodb:
    uri: mongodb://localhost:27017/adaptive_rag
  data:
    mongodb:
      # Create indexes declared with @Indexed (e.g. on sessionId) at startup
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

rag:
  chunking:
    # Smaller chunks keep each vector focused on one topic (e.g. a CV's skills section)
    chunk-size: 200
    overlap: 40
  retrieval:
    # 200-word chunks: 6 covers a full section (e.g. all jobs in a CV) and still keeps the prompt small
    top-k: 6
    # The router already keeps off-topic questions away; this only drops clearly unrelated chunks.
    # With nomic task prefixes, relevant chunks typically score ~0.5-0.6.
    similarity-threshold: 0.35
  embedding:
    # nomic-embed-text was trained with these task prefixes; leave empty for models that don't use them.
    # Changing them (or the embedding model) requires deleting the Qdrant collection and re-ingesting.
    query-prefix: "search_query: "
    document-prefix: "search_document: "
  chat-history:
    max-messages: 6
  web-search:
    max-results: 5
    tavily:
      base-url: https://api.tavily.com
      # Never commit the key: it's read from the TAVILY_API_KEY environment variable
      api-key: ${TAVILY_API_KEY:}
