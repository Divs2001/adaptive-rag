spring:
  application:
    name: adaptive-rag
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documents
        initialize-schema: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/adaptive_rag
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

rag:
  chunking:
    chunk-size: 500
    overlap: 50
  retrieval:
    top-k: 4
    similarity-threshold: 0.5
